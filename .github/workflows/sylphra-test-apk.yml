name: Sylphra Launcher test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sylphra-test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: .local/ci-target
    steps:
      - name: Check out authorized branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: android
          persist-credentials: false

      - name: Set up Java 17 for Android Gradle Plugin
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android native toolchain
        run: |
          sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0"
          rustup target add aarch64-linux-android

      - name: Restore the test-only signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .local/android/debug.keystore
          key: sylphra-test-signing-v1

      - name: Prepare pinned Minecraft-derived engine tables
        run: python3 tools/android_prepare.py

      - name: Build and audit isolated arm64 test APK
        run: |
          python3 tools/android_build.py \
            --abi arm64-v8a \
            --app-id dev.sylphra.android.test \
            --app-name "Sylphra Launcher" \
            --public \
            --release-candidate \
            --profile release \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME_17_X64" \
            --gradle "$(command -v gradle)"

      - name: Upload test APK (not a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sylphra-launcher-arm64-test
          path: .local/android/apk/arm64-v8a/sylphra-launcher-android-public.apk
          if-no-files-found: error
          retention-days: 7
